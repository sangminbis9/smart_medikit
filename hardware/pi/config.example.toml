# 상대 경로는 이 설정 파일의 폴더를 기준으로 한다.
box_id = "inha-capstone-02-medkit"
pi_model = "Raspberry Pi 5"
# 원본 Pi 프로그램과 사진·전송 대기열을 공유하지 않는다.
data_dir = "../../local_data/hardware_pi"

[camera]
preview_size = [768, 432]
still_size = [4608, 2592]
fps = 15
timeout_seconds = 3.0
still_delay_frames = 3
camera_index = 0
restart_seconds = 2.0
jpeg_quality = 95

[gpio]
# 센서의 실제 BCM 번호를 입력한다. -1이면 실기기 실행을 차단한다.
lid_pin = -1
# 16구 GRB 링의 DI는 물리 핀 12(BCM18)에 연결한다.
ring_data_pin = 18
ring_brightness = 0.005
ring_pulse_seconds = 0.5
lid_pull_up = true
lid_closed_when_active = true
debounce_seconds = 0.08

[detector]
model_path = "models/yoloe-26n-medikit.pt"
source_model = "yoloe-26n-seg.pt"
# 새 모델은 PC 실험에서 사용한 8개 후보 범주로 준비한다.
prompts = ["medicine box", "prescription medicine bag", "medicine sachet", "pill blister pack", "medicine bottle", "ointment tube", "medical patch package", "paper document"]
image_size = 320
confidence = 0.25
threads = 2
interval_seconds = 0.4
max_age_seconds = 1.2

[vision]
analysis_width = 320
warmup_seconds = 0.6
stable_seconds = 0.6
motion_threshold = 0.018
# 손으로 든 포장의 미리보기는 내부 촬영보다 움직임을 더 허용한다.
package_motion_threshold = 0.055
pixel_threshold = 25
minimum_change = 0.08
# 이보다 작은 포장도 후보로 유지하고 크기 경고만 표시한다.
min_area = 0.01
max_area = 0.9
min_iou = 0.45
# 작은 포장(min_area 미만 또는 여백 포함 짧은 변 160px 미만)은 경고만 표시한다.
min_short_side = 160
# 포장 선명도는 초기 실험값으로 시작하며 실물 라벨의 가독성에 맞춰 조정한다.
sharpness_threshold = 500.0
still_sharpness_threshold = 500.0
interior_min_sharpness = 65.0
min_brightness = 50.0
max_brightness = 210.0
max_dark_ratio = 0.30
max_bright_ratio = 0.20
capture_motion_threshold = 0.08
package_capture_motion_threshold = 0.22
close_settle_seconds = 0.75
close_attempt_seconds = 3.0
close_retries = 2
package_retry_seconds = 1.0

[cabinet]
width_mm = 305
depth_mm = 165
height_mm = 190
# 내부 사진의 좌상·우상·우하·좌하 모서리를 정규화 좌표로 입력한 뒤 true로 바꾼다.
calibrated = false
corners = [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0], [0.0, 1.0]]

[aws]
staged_capture = true
ocr_input_prefix = "ocr-input"
# 배선·인증 점검 후 config.toml에서만 true로 바꾼다.
enabled = false
contract_confirmed = true
poll_seconds = 2.5
expected_account_id = "842544789367"
bucket = "inha-capstone-02-s3"
region = "ap-northeast-2"
prefix = "medkit-sessions"
manifest_name = "closed-ready.json"
status_url_template = "https://yqcfg2houe.execute-api.ap-northeast-2.amazonaws.com/capture-events/{event_id}"
auth_mode = "sigv4"
