# 상대 경로는 이 설정 파일의 폴더를 기준으로 한다.
box_id = "inha-capstone-02-medkit"
pi_model = "unconfirmed"
# 원본 Pi 프로그램과 사진·전송 대기열을 공유하지 않는다.
data_dir = "../../local_data/hardware_pi"

[camera]
preview_size = [768, 432]
still_size = [4608, 2592]
fps = 15
timeout_seconds = 3.0
still_delay_frames = 3
camera_index = 0
restart_seconds = 2.0
jpeg_quality = 95

[gpio]
# 실제 배선 후 BCM 번호를 지정한다. -1은 미설정으로 실행을 차단한다.
lid_pin = -1
lamp_pin = -1
white_pin = -1
blue_pin = -1
green_pin = -1
yellow_pin = -1
red_pin = -1
lid_pull_up = true
lid_closed_when_active = true
output_active_high = true
debounce_seconds = 0.08

[detector]
model_path = "models/yoloe-26n-medikit.pt"
source_model = "yoloe-26n-seg.pt"
prompts = ["medicine box", "prescription medicine bag", "pill blister pack", "syrup bottle", "ointment tube", "medicine pouch", "cardboard box", "bottle"]
image_size = 320
confidence = 0.25
threads = 2
interval_seconds = 0.4
max_age_seconds = 1.2

[vision]
analysis_width = 320
warmup_seconds = 0.6
stable_seconds = 1.0
motion_threshold = 0.018
pixel_threshold = 25
minimum_change = 0.08
min_area = 0.01
max_area = 0.9
min_iou = 0.6
sharpness_threshold = 65.0
still_sharpness_threshold = 65.0
capture_motion_threshold = 0.08
close_settle_seconds = 0.75
close_attempt_seconds = 3.0
close_retries = 2
package_retry_seconds = 1.0

[cabinet]
width_mm = 305
depth_mm = 165
height_mm = 190
# 내부 사진의 좌상·우상·우하·좌하 모서리를 정규화 좌표로 입력한 뒤 true로 바꾼다.
calibrated = false
corners = [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0], [0.0, 1.0]]

[aws]
staged_capture = true
ocr_input_prefix = "ocr-input"
# 배선·인증 점검 후 config.toml에서만 true로 바꾼다.
enabled = false
contract_confirmed = true
poll_seconds = 2.5
expected_account_id = "842544789367"
bucket = "inha-capstone-02-s3"
region = "ap-northeast-2"
prefix = "medkit-sessions"
manifest_name = "closed-ready.json"
status_url_template = "https://yqcfg2houe.execute-api.ap-northeast-2.amazonaws.com/capture-events/{event_id}"
auth_mode = "sigv4"
